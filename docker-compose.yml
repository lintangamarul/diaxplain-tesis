services:
  ml:
    build:
      context: ./ml
      dockerfile: ../docker/python/Dockerfile
    container_name: diaxplain_ml
    ports:
      - "8001:8001"
    env_file:
      - ./ml/.env
    volumes:
      - ./ml:/app
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../docker/php/Dockerfile
    container_name: diaxplain_web
    ports:
      - "8000:8000"
    env_file:
      - ./web/.env
    volumes:
      - ./web:/var/www/html
      - ./ml/artifacts:/var/www/ml/artifacts
    depends_on:
      - ml
    restart: unless-stopped

